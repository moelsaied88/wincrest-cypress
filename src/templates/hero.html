<article class="hero{{FLIP}}" id="{{ID}}">
  <figure class="hero__figure">{{IMAGE_RAW}}</figure>
  <div class="hero__text">
    <p class="hero__distance">{{DISTANCE}}</p>
    <h3 class="hero__name">{{NAME}}</h3>
    <p class="hero__body">{{BODY}}</p>
    {{NOTE_RAW}}
    <p class="hero__meta">{{META}}</p>
    {{LINK_RAW}}
  </div>
</article>
